<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CircuitAlive · 电路活了</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- 源码入口:必须通过 Vite 运行(npm run dev 或 npm run build 后的 dist/)。
         直接双击本文件打开会因 /src/main.js 无法解析而白屏。 -->
    <noscript>CircuitAlive 需要启用 JavaScript。</noscript>
    <script>
      /* 直接以 file:// 打开源码时给出明确提示,而不是静默白屏 */
      if (location.protocol === 'file:') {
        document.getElementById('app').innerHTML =
          '<div style="font-family:serif;padding:48px;line-height:2">' +
          '<h1 style="font-size:24px">这是源码入口</h1>' +
          '<p>请用 <code>npm run dev</code> 启动开发服务器,或打开构建后的 <code>dist/index.html</code>。</p>' +
          '<p>在线版:<a href="https://nb-group.github.io/CircuitAlive/">nb-group.github.io/CircuitAlive</a></p>' +
          '</div>';
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
